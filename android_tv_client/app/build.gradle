plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.rrbillingpro.tvclient'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rrbillingpro.tvclient'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // ExoPlayer (media3): player paling tahan banting di Android TV —
    // dipakai Netflix/YouTube; HTTP source toleran ke server media kasir
    // (HEAD/Range/206), retry otomatis, dan memberi kode error yang jelas.
    // 1.4.1 = versi yang kompatibel dengan compileSdk 34 / AGP 8.5.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'
}
